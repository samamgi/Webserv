<body>
    <header>
        <nav>
            <a href="/index.html" class="nav-brand">WebServ</a>
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="/about.html">About</a></li>

            </ul>
        </nav>
    </header>
    <script>
        document.addEventListener("submit", function(e) {

            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            xhr = new XMLHttpRequest();
            xhr.open("POST", "/cgi-bin/upload.py", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    document.querySelector("#form").style.display = "none";
                    document.querySelector("#form2").style.display = "block";
                    document.querySelector(".success-content").textContent = "File uploaded successfully! \n" + xhr.responseText;

                    // window.location.href = "/cgi-bin/upload.py";
                    // alert("File uploaded successfully!");
                } else {
                    // alert("Error uploading file: " + xhr.statusText);
                    document.querySelector(".error-content").textContent = "An error occurred during the upload.";
                }
            };
            xhr.onerror = function() {
                // alert("Network error occurred during the upload.");
                document.querySelector(".error-content").textContent = "An error occurred during the upload.";
            };
            xhr.send(formData);
        });
    </script>
    <main>
        <div class="card">
            <h1>Upload a File</h1>
            <form action="/cgi-bin/upload.py" method="post" enctype="multipart/form-data" class="contact-form" id="form">
                <input class="file" type="file" name="filename" id="file" required>
                <button type="submit" class="btn" class="btn" id="btn-submit">Upload File</button>
                <div class="error-content"></div>
            </form>
            <div class="contact-form" id="form2" style="display: none">
                <div class="success-content"></div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 42 / WEBSERV</p>
    </footer>
</body>
</html>
